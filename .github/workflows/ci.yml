name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test-all.py
      - run: python -m compileall -q scripts
      - run: git diff --check
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/test-all.py
      - run: python scripts/build.py --portable --output '.build/preview/Terminal Pilot.app'
      - run: python scripts/verify-portable.py '.build/preview/Terminal Pilot.app'
      - run: python scripts/export-source.py
      - run: python scripts/package-release.py --unsigned-preview --zip-only
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: developer-preview-unnotarized
          path: dist/release/
          retention-days: 7
